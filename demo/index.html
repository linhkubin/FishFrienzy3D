<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import GUI from 'lil-gui';

// =============================================================================
// Parameters. Every value marked [APK] was read from the shipped game:
// serialized component values (CameraRig, FishTailSway, FishSwimMotion,
// FloatingJoystick) or constants in decompiled ARMv7 code.
// =============================================================================
const P = {
  // CameraRig.Apply: pos = focus + Euler(RotationOffset)·(PositionOffset·Zoom)          [APK]
  camPitch: 37.5, camDistance: 9.95, camFov: 38, camNear: 0.05, camFar: 60,
  camSmooth: 0.22,         // focus SmoothDamp time (s) — estimate
  // control feel (demo smoothing on top of the game's instant sim velocity)
  // joystick: no input smoothing; swim direction follows the stick angle fast
  // steerInstant = game behaviour: swim direction & speed follow the stick in the same
  // frame (Sim.TickPlayerMovement); only the model turns via HeadingSmoother (997°/s).
  steerInstant: true, stickSmooth: 0, steerRate: 1800, steerSmooth: 0.025, velSmooth: 0, steerMinStick: 0.08,
  // Sim.TickPlayerMovement: velocity = stick · 165 sim/s, WorldSpace scale 0.01 → 1.65 m/s, instant  [APK]
  speed: 1.65,
  // dash / lunge (design doc "Lao đớp"): bursts ~3 body lengths straight ahead, eased out.
  // Costs one stamina charge; charges refill one at a time.
  // Speed rises smoothly to a peak at 1/3 of the dash and glides out (no instant jolt).
  dashDist: 2.6, dashTime: 0.55, dashCharges: 3, dashRegen: 2.5, dashTailBoost: 1.6, dashBuffer: 0.15,
  dashSteer: 260,          // °/s the stick can turn the fish while dashing
  stopSmooth: 0.35,        // s: glide to a stop instead of halting instantly
  pillars: false,          // test layout with tall rock pillars (false = original open map)
  bubbleSize: 2.1, bubbleRate: 1.5,   // swim bubbles: size and amount multipliers
  // fin trails: soft ribbons behind the tail-fin lobes and pectoral fins while swimming
  finTrail: true, trailLife: 0.45, trailWidth: 0.016, trailOpacity: 0.85,
  showFps: false, autoQuality: true,   // fps meter; lower resolution/shadows if frames drop
  dashFx: true, dashFov: 5, // dash effects on/off; camera FOV kick (°) at the dash peak
  // double tap: second press within dblTapMs of a quick tap (shorter than tapMs, moved
  // less than tapMove px), at most dblTapDist px away. A released stick keeps steering
  // for joyGraceMs, so a double tap mid-swim doesn't reset the direction.
  dblTapMs: 300, dblTapDist: 90, tapMs: 220, tapMove: 18, joyGraceMs: 320,
  // HeadingSmoother + PlayerAntRig._turning (hero prefab): MaxTurnRate 997°/s, TurnSmoothTime 0.024 s [APK]
  rig: 'hero', turnRate: 997, turnSmooth: 0.024,
  // AntView.WalkAnimationSpeed = v/165 · 1 · 4.15 → Animator "MovementAnimationSpeed" (damped)  [APK]
  animDamp: 0.1,           // Animator SetFloat damp time — estimate
  // FishTailSway: Degrees, Seconds, AtRest, BlendSeconds, BodyDegrees, HeadDegrees, LagDegrees, cruise  [APK]
  tailDegrees: 26, tailSeconds: 0.65, atRest: 0.3, tailBlend: 0.6,
  // body motion model: 'natural' (travelling body wave + recoil + path-following turn curl)
  // or 'game' (FishTailSway formula exactly as decompiled — body barely moves, ±5° mid-body)
  // reference video (Fish.mp4): the body stays rigid; life comes from tail-fin flick,
  // pectoral flapping and strong roll in turns → default to the decompiled game formula
  motion: 'game',
  // natCurl 0 = like the game (hero fish has no turn clip, the body stays straight while it turns)
  natHead: 3, natTail: 24, natWave: 0.95, natRecoil: 3,
  // soft turn curl (procedural spring chain): 0 = rigid like the game's hero fish
  // tuned at 60fps: 90° turn → tail ~33°, mid-body ~17°, small whip (~2–3°), settles ~0.3 s
  natCurl: 0, curlHz: 13, curlDamp: 0.6, curlLoose: 0.3,
  // game mode: turn bend only on the tail section (video: rigid front, tail lags & whips)
  turnTailBend: 1.2, turnBendStart: 0.38, stalkCurve: 0.45,
  // extra fold for U-turns (≈180°): gain grows as the tail trails the head by 70°→170°
  curlBigTurn: 0.7, curlMaxFold: 90,
  // fin follow-through (demo addition on top of the game's hinge, 0 = rigid like the raw formula)
  finFollow: 0.35, finSpringHz: 3.2, finSpringDamp: 0.4,
  // tail section hinge (fraction of length from the nose) and joint softness. Tuned to
  // the reference video: tail tip swings ≈33% of body length peak-to-peak at ~1.5 Hz.
  tailHinge: 0.62, tailJointSoft: 0.12,   // softer joint → body flows into the tail (was 0.06)
  // FishFins (pectorals): SweepDegrees, SweepSeconds, ReturnSeconds, OpenOnTurn,
  // TurnRateForFullOpen, TurnSmoothSeconds, FlutterDegrees, FlutterHertz                  [APK]
  pecSweep: 40, pecSweepSec: 0.22, pecReturnSec: 0.6, pecOpenOnTurn: 0.7, pecTurnFull: 220, pecTurnSmooth: 0.25,
  // game value FlutterDegrees 1.5; the video shows clearly visible flapping, so the demo
  // uses a larger stroke on its (smaller) fins
  pecFlutter: 6, pecFlutterHz: 1.6,
  // rest angle back from straight out (°), and edge-on twist on the return stroke (°)
  pecRest: 25, pecFeather: 55,
  // bodyDegrees raised from 12 so the mid-body → tail stalk visibly curves, not just the fin
  bodyDegrees: 22, headDegrees: 6, lagDegrees: 35, cruiseSpeed: 4.15,
  // FishSwimMotion: WagHertz, IdleSwayDegrees, IdleBob, IdleHertz, BlendSeconds            [APK]
  wagHertz: 2.4, idleSway: 2.5, idleBob: 0.006, idleHertz: 0.55, swimBlend: 0.22,
  // FishSwimMotion.TickBank: BankPerTurnRate, MaxBankDegrees, BankSmoothSeconds              [APK]
  // game: MaxBankDegrees 20; the video shows the fish rolling much further in turns
  bankPerTurnRate: 0.06, maxBank: 35, bankSmooth: 0.09,
  // FishSwimMotion.TickRise: RiseEvery, RiseHeight, RiseUp, RiseHold, RiseDown, RisePitchPerSpeed [APK]
  // swim band (per level / "tầng"): the fish keeps gliding up and down between
  // swimHeight and swimHeight + bandHeight in a slow, slightly irregular rhythm.
  // band = false → the old random TickRise hops instead.
  band: true, bandHeight: 0.22, bandPeriod: 5.0,
  // never still: with the stick released the fish hovers — drifts a little forward and
  // back along its heading and rocks gently (pitch / roll) instead of freezing in place
  driftAmp: 0.05, driftPeriod: 3.2, idleRoll: 4, idlePitch: 3,
  rise: true, riseEvery: [3, 8], riseHeight: [0.12, 0.3], riseUp: 1.1, riseHold: [0.8, 2.0], riseDown: 1.6, risePitch: 60,
  // model: mesh ≈ 0.61 long × Model scale 0.829, centre ≈ 0.235 above ground               [APK]
  fishLength: 0.5, swimHeight: 0.19,     // low over the sand ("là là"); game model sits at 0.235
  // obstacles: climb over anything up to maxClimb high, otherwise collide & slide around
  // fishBelly = how far the belly hangs below the fish's centre at its thickest
  // (SH.h·SH.belly ≈ 0.146 for the mesh) — the whole body footprint is kept above low rocks;
  // climbUp is a little slower so it eases up instead of popping up.
  maxClimb: 0.5, climbClear: 0.015, climbUp: 0.26, climbDown: 0.6, climbLook: 0.5,
  // tall rocks ahead: start steering earlier and gentler (avoidLook / avoidSteer), ease the
  // steer in and out over avoidSmooth seconds, and keep the chosen side (no left/right flip)
  fishRadius: 0.13, fishBelly: 0.15, avoidSteer: 32, avoidLook: 1.4, avoidSmooth: 0.3,
  // FloatingJoystick.Radius 168.5 (1080p canvas) ≈ 72 CSS px, DeadZone 0                   [APK]
  joyRadius: 72,
};

// =============================================================================
// Renderer / scene
// =============================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const BG = new THREE.Color(0.945, 0.918, 0.847);          // CameraRig.Background [APK]
scene.background = BG;
scene.fog = new THREE.Fog(BG, 14, 30);
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(P.camFov, innerWidth / innerHeight, P.camNear, P.camFar);

scene.add(new THREE.HemisphereLight(0xfffaf0, 0xc2cfbf, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 4;
sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
scene.add(sun, sun.target);

// ---- seabed with moving caustics -------------------------------------------
const time = { value: 0 };
const groundGeo = new THREE.PlaneGeometry(120, 120, 200, 200);
groundGeo.rotateX(-Math.PI / 2);
{
  const p = groundGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i);
    p.setY(i, Math.sin(x * 0.5) * Math.cos(z * 0.4) * 0.03 + Math.sin(x * 2.3 + z * 1.7) * 0.01);
  }
  groundGeo.computeVertexNormals();
}
const groundMat = new THREE.MeshStandardMaterial({ color: 0xf3e3bd, roughness: 1 });
groundMat.onBeforeCompile = (s) => {
  s.uniforms.uTime = time;
  s.vertexShader = s.vertexShader
    .replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
    .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWP = (modelMatrix * vec4(transformed,1.0)).xyz;');
  s.fragmentShader = s.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWP; uniform float uTime;
      float caustic(vec2 p){
        float c = 0.0;
        for(int i=0;i<3;i++){
          float fi = float(i);
          vec2 q = p*(1.0+fi*0.6) + vec2(uTime*0.25*(1.0+fi*0.3), -uTime*0.2);
          c += abs(sin(q.x+sin(q.y*1.3+uTime*0.7)) * sin(q.y+sin(q.x*1.1-uTime*0.5)));
        }
        return pow(1.0 - c/3.0, 6.0);
      }`)
    .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      totalEmissiveRadiance += vec3(1.0,0.97,0.85) * caustic(vWP.xz*2.0) * 0.42;`);
};
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.receiveShadow = true;
scene.add(ground);

const rand = (a, b) => a + Math.random() * (b - a);
const rockMat = new THREE.MeshStandardMaterial({ color: 0xc4b598, roughness: 0.95, flatShading: true });
// Obstacles the fish has to deal with: { x, z, r (horizontal radius), top (height) }.
// Low rocks are climbed over; anything taller than P.maxClimb blocks the fish.
const OBST = [];
// Real shape of a rock object (a mesh, or a group of meshes for a pillar), measured from
// its transformed vertices. The random x/y rotation tilts the squashed dodecahedron, so
// the visible top can be far above r·0.25 + r·scale.y and must not be guessed.
//   r     — widest horizontal reach of the rock from (x, z)  (used for the solid walls)
//   top   — highest point
//   parts — one ellipsoid per dodecahedron (its vertices lie on that ellipsoid, the flat
//           faces inside it), for the exact "how high is the rock under this point" test
function rockObst(obj, x, z) {
  obj.updateMatrixWorld(true);
  const o = { x, z, r: 0, top: 0, parts: [] }, v = new THREE.Vector3();
  obj.traverse((m) => {
    if (!m.isMesh) return;
    const p = m.geometry.attributes.position;
    for (let i = 0; i < p.count; i++) {
      v.fromBufferAttribute(p, i).applyMatrix4(m.matrixWorld);
      o.top = Math.max(o.top, v.y);
      o.r = Math.max(o.r, Math.hypot(v.x - x, v.z - z));
    }
    const A = new THREE.Matrix3().setFromMatrix4(m.matrixWorld).invert().elements;
    const c = new THREE.Vector3().setFromMatrixPosition(m.matrixWorld);
    o.parts.push({ cx: c.x, cy: c.y, cz: c.z, A, ww: A[3] * A[3] + A[4] * A[4] + A[5] * A[5], r: m.geometry.parameters.radius });
  });
  return o;
}
const clearOfSpawn = (x, z, r) => Math.hypot(x, z) > r + 0.8;
for (let i = 0; i < 90; i++) {
  const r = rand(0.1, 0.5);
  const x = rand(-25, 25), z = rand(-25, 25);
  if (!clearOfSpawn(x, z, r)) continue;
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), rockMat);
  m.position.set(x, r * 0.25, z);
  m.scale.y = rand(0.45, 0.8);
  m.rotation.set(rand(0, 3), rand(0, 3), 0);
  m.castShadow = m.receiveShadow = true;
  scene.add(m);
  OBST.push(rockObst(m, x, z));
}
// Test layout (extra rocks near the start + tall rock pillars). Off by default = the
// original open map; the "rock pillars" toggle in Tuning brings them back.
const baseObst = OBST.slice(), extraObst = [], extraObjs = [];
// a few close to the start so both cases are easy to try
const extraRocks = [[1.2, 1.6, 0.32, 0.6], [-1.4, 2.4, 0.4, 0.55], [0.6, -1.8, 0.26, 0.7], [2.6, -0.4, 0.38, 0.5]];
for (const [x, z, r, sy] of extraRocks) {
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 1), rockMat);
  m.position.set(x, r * 0.25, z); m.scale.y = sy; m.rotation.set(rand(0, 3), rand(0, 3), 0);
  m.castShadow = m.receiveShadow = true; scene.add(m); extraObjs.push(m);
  extraObst.push(rockObst(m, x, z));
}
// tall rock pillars: too high to swim over → the fish bumps into them or slides around
const pillarMat = new THREE.MeshStandardMaterial({ color: 0xb3a487, roughness: 0.95, flatShading: true });
const pillars = [[-2.2, -0.8, 0.45, 1.4], [2.0, 3.2, 0.55, 1.8], [-0.4, 4.4, 0.35, 1.1]];
for (let i = 0; i < 26; i++) pillars.push([rand(-24, 24), rand(-24, 24), rand(0.3, 0.7), rand(0.9, 2.0)]);
for (const [x, z, r, h] of pillars) {
  if (!clearOfSpawn(x, z, r)) continue;
  const g = new THREE.Group();
  const n = 3 + (Math.random() * 2 | 0);
  for (let k = 0; k < n; k++) {
    const rr = r * (1 - k * 0.12);
    const m = new THREE.Mesh(new THREE.DodecahedronGeometry(rr, 1), pillarMat);
    m.position.set(rand(-0.04, 0.04), h * (k + 0.5) / n, rand(-0.04, 0.04));
    m.scale.set(1, (h / n) / rr * 0.62, 1);
    m.rotation.set(rand(0, 0.3), rand(0, 3), rand(0, 0.3));
    m.castShadow = m.receiveShadow = true;
    g.add(m);
  }
  g.position.set(x, 0, z);
  scene.add(g); extraObjs.push(g);
  extraObst.push(rockObst(g, x, z));
}
function applyMap() {
  OBST.length = 0; OBST.push(...baseObst);
  if (P.pillars) OBST.push(...extraObst);
  for (const o of extraObjs) o.visible = P.pillars;
}
applyMap();
const weedMat = new THREE.MeshStandardMaterial({ color: 0x67ad74, side: THREE.DoubleSide, roughness: 0.8 });
weedMat.onBeforeCompile = (s) => {
  s.uniforms.uTime = time;
  s.vertexShader = s.vertexShader
    .replace('#include <common>', '#include <common>\nuniform float uTime;')
    .replace('#include <begin_vertex>', `#include <begin_vertex>
      vec4 wp0 = modelMatrix * vec4(0.,0.,0.,1.);
      float k = position.y * position.y * 0.45;
      transformed.x += sin(uTime*1.3 + wp0.x*0.4 + position.y*1.2) * k;
      transformed.z += cos(uTime*1.1 + wp0.z*0.4 + position.y) * k * 0.6;`);
};
for (let i = 0; i < 160; i++) {
  const h = rand(0.3, 0.9);
  const geo = new THREE.PlaneGeometry(0.06, h, 1, 8);
  geo.translate(0, h / 2, 0);
  const m = new THREE.Mesh(geo, weedMat);
  m.position.set(rand(-25, 25), 0, rand(-25, 25));
  m.rotation.y = rand(0, Math.PI);
  m.castShadow = true;
  scene.add(m);
}
{
  const peb = new THREE.InstancedMesh(new THREE.SphereGeometry(0.03, 8, 6), new THREE.MeshStandardMaterial({ color: 0xfff6e2, roughness: 0.6 }), 500);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sc = new THREE.Vector3();
  for (let i = 0; i < 500; i++) { const k = rand(0.5, 1.6); peb.setMatrixAt(i, m4.compose(v.set(rand(-25, 25), 0.008, rand(-25, 25)), q, sc.set(k, k * 0.45, k))); }
  peb.receiveShadow = true;
  scene.add(peb);
}

// =============================================================================
// Fish model (original design). Every vertex stores `along` (0 nose → 1 tail
// tip); the vertex shader places it on a spine computed each frame on the CPU.
// =============================================================================
const deg = THREE.MathUtils.degToRad;
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const smooth = (e0, e1, x) => { const k = clamp01((x - e0) / (e1 - e0)); return k * k * (3 - 2 * k); };

const L = P.fishLength;          // nose → tail-fin tip (m)
const K = 32;                    // spine samples
const T_BODY = 0.76;             // body ends, tail fin begins
// Skeleton of the hero model: Spine_0 (head) … Spine_6, 0.0732 apart, nose→tip = 0.61   [APK]
// → bone positions along the body 0.28, 0.40 … 1.00. TailFin hinge hangs off Spine_4.
// The fish's sim position (turn pivot) sits at Spine_0: Model offset 0.1255 + PivotShift −0.149.
const T_PIVOT = 0.28;
const BONES = [0.28, 0.40, 0.52, 0.64, 0.76, 0.88, 1.0];
let T_HINGE = 0.78;   // overwritten from P.tailHinge each frame

const SH = { h: 0.27 * L, w: 0.2 * L, peak: 0.38, ped: 0.32, belly: 1.08 };
function envelope(t) {
  const u = Math.min(t, T_BODY) / T_BODY;
  if (u < SH.peak) { const k = 1 - u / SH.peak; return Math.pow(Math.max(0, 1 - Math.pow(k, 2.4)), 0.5); }
  const k = (u - SH.peak) / (1 - SH.peak);
  return SH.ped + (1 - SH.ped) * (0.5 + 0.5 * Math.cos(Math.PI * Math.pow(k, 0.85)));
}

const PAL = {
  top: 0xff8c1a, side: 0xffb431, belly: 0xfff1cf, cheek: 0xffd27a,
  fin: 0xff7a3d, finEdge: 0xffd9a0, iris: 0x2b1d14,
};

function buildBody() {
  const NS = 64, NR = 32;
  const pos = [], col = [], along = [], idx = [];
  const cTop = new THREE.Color(PAL.top), cSide = new THREE.Color(PAL.side), cBelly = new THREE.Color(PAL.belly), cCheek = new THREE.Color(PAL.cheek);
  const c = new THREE.Color();
  for (let i = 0; i <= NS; i++) {
    const t = (i / NS) * T_BODY, e = envelope(t), u = t / T_BODY;
    const H = SH.h * e, W = SH.w * e * (1 - 0.18 * u);
    for (let j = 0; j <= NR; j++) {
      const a = (j / NR) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      pos.push(Math.sign(ca) * Math.pow(Math.abs(ca), 0.85) * W,
               Math.sign(sa) * Math.pow(Math.abs(sa), 0.9) * H * (sa < 0 ? SH.belly : 1), 0);
      along.push(t);
      if (sa > 0) c.copy(cSide).lerp(cTop, Math.pow(sa, 1.3)); else c.copy(cSide).lerp(cBelly, Math.pow(-sa, 0.6));
      // soft cheek patch and darker back towards the tail
      const cheek = (1 - smooth(0.05, 0.12, Math.abs(u - 0.22))) * (1 - smooth(0.0, 0.5, Math.abs(sa + 0.05)));
      c.lerp(cCheek, cheek * 0.6);
      c.multiplyScalar(1 - 0.12 * smooth(0.5, 1, u) * Math.max(0, sa));
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < NS; i++) for (let j = 0; j < NR; j++) {
    const a = i * (NR + 1) + j, b = a + NR + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setAttribute('along', new THREE.Float32BufferAttribute(along, 1));
  g.setAttribute('flex', new THREE.Float32BufferAttribute(new Float32Array(along.length), 1));
  g.setIndex(idx);
  // normals from a straight copy (z comes from the spine at runtime)
  const tmp = g.clone();

// Frame pacing. rAF timestamps wobble by 1–2 ms and a frame now and then misses a vsync.
// Stepping the sim with that raw delta makes motion drift against the display's fixed
// refresh, which reads as stutter. Instead: estimate the refresh interval (median of recent
// deltas, snapped to common rates), step in whole refresh intervals, and carry the leftover

  pace.drift += raw;

  const n = THREE.MathUtils.clamp(Math.round(pace.drift / pace.interval), 1, maxN);
  pace.drift -= n * pace.interval;

  // remember which frames missed a refresh, for adaptive quality
  pace.slow.push(n > 1 ? 1 : 0); if (pace.slow.length > 120) pace.slow.shift();
  pace.fpsN++; pace.fpsT += raw;
  if (pace.fpsT >= 500) { pace.fps = pace.fpsN * 1000 / pace.fpsT; pace.fpsN = pace.fpsT = 0; pace.fpsNew = true; }
