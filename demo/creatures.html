<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bể cá · Bé Cá Phiêu Lưu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#efe6d2; --cream-dim:rgba(239,230,210,.66); --cream-faint:rgba(239,230,210,.28);
    --deep:#143634; --panel:rgba(18,46,45,.86); --coral:#e07a5f; --gold:#d6a24e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#1d4c4a;color:var(--cream);
    font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- HUD (mô phỏng giao diện trong màn) ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;transition:opacity .3s}
  #hud.off{opacity:0}
  .h-grow{position:absolute;left:clamp(14px,2.4vw,40px);top:clamp(12px,3vh,30px);display:flex;gap:clamp(6px,1vw,14px);
    align-items:center;padding:clamp(6px,1vh,10px) clamp(12px,1.6vw,22px);border:2px solid rgba(239,230,210,.5);border-radius:999px;
    background:rgba(16,44,43,.16)}
  .h-grow svg{width:clamp(22px,2.4vw,34px);height:auto;fill:#6f8986;opacity:.95}
  .h-grow svg.a{fill:#d39b55}.h-grow svg.b{fill:#e07a5f}
  .h-combo{position:absolute;left:50%;top:clamp(14px,3.6vh,34px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;
    font-style:italic;font-weight:800;font-size:clamp(24px,3.2vw,44px);color:#efe2c2;letter-spacing:.5px;text-shadow:0 2px 10px rgba(10,35,34,.35)}
  .h-combo i{font-style:normal;font-size:.42em;opacity:.9}
  .h-right{position:absolute;right:clamp(14px,2.4vw,40px);top:clamp(12px,3vh,30px);display:flex;align-items:center;gap:clamp(10px,1.4vw,22px);
    font-weight:800;font-size:clamp(17px,1.9vw,26px)}
  .h-pearl{width:clamp(22px,2.3vw,32px);aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fffdf7 0 18%,#efe6dc 38%,#c9bfb4 78%,#a99f96 100%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .h-pause{width:clamp(36px,3.6vw,50px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(239,230,210,.6);display:grid;place-items:center}
  .h-pause::before{content:"";width:34%;height:36%;border-left:4px solid var(--cream);border-right:4px solid var(--cream)}
  .h-joy{position:absolute;left:clamp(26px,3.6vw,64px);bottom:clamp(20px,5vh,56px);width:clamp(110px,11.5vw,160px);aspect-ratio:1;border-radius:50%;
    border:2px solid rgba(239,230,210,.5);background:rgba(239,230,210,.08)}
  .h-joy::after{content:"";position:absolute;left:52%;top:30%;width:34%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
    background:radial-gradient(circle at 40% 35%,#fbf6ea,#e2d8c3);box-shadow:0 4px 10px rgba(0,0,0,.25)}
  .h-joy b{position:absolute;width:0;height:0;border:6px solid transparent;opacity:.7}
  .h-joy b.u{left:50%;top:9%;transform:translateX(-50%);border-bottom-color:var(--cream)}
  .h-joy b.d{left:50%;bottom:9%;transform:translateX(-50%);border-top-color:var(--cream)}
  .h-joy b.l{top:50%;left:9%;transform:translateY(-50%);border-right-color:var(--cream)}
  .h-joy b.r{top:50%;right:9%;transform:translateY(-50%);border-left-color:var(--cream)}
  .h-dash{position:absolute;right:clamp(20px,2.6vw,44px);bottom:clamp(22px,5.4vh,60px);display:flex;gap:clamp(10px,1.2vw,16px);
    padding:10px 16px;border-radius:16px;background:rgba(16,44,43,.32)}
  .h-dash i{width:clamp(16px,1.6vw,22px);aspect-ratio:1;border-radius:50%;border:2px solid var(--cream)}
  .h-dash i.on{background:var(--cream)}
  .h-warn{position:absolute;right:0;top:41%;width:clamp(44px,4.2vw,62px);height:clamp(54px,5.2vw,76px);animation:blink 1s infinite}
  .h-warn::before{content:"";position:absolute;right:0;top:0;width:100%;height:100%;
    clip-path:polygon(100% 0,100% 100%,0 50%);background:linear-gradient(90deg,#f0806a,#d95a44);opacity:.9}
  .h-warn::after{content:"";position:absolute;right:calc(100% + 4px);top:50%;width:18px;height:2px;background:#f0806a;transform:translateY(-50%);
    box-shadow:6px -16px 0 #f0806a,6px 16px 0 #f0806a;opacity:.85}
  @keyframes blink{50%{opacity:.45}}

  /* ---------- Thanh điều khiển ---------- */
  #bar{position:fixed;left:50%;bottom:clamp(12px,2.4vh,24px);transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:999px;
    max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;
    background:rgba(14,40,39,.72);border:1px solid rgba(239,230,210,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:5}
  #bar button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--cream-dim);white-space:nowrap}
  #bar button.on{background:rgba(239,230,210,.14);color:var(--cream)}
  #bar button:hover{color:var(--cream)}
  #bar .sep{width:1px;background:rgba(239,230,210,.16);margin:6px 2px}

  /* ---------- Ngăn bộ sưu tập ---------- */
  #drawer{position:fixed;left:0;top:0;bottom:0;width:min(300px,84vw);background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-right:1px solid rgba(239,230,210,.12);transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:6;display:flex;flex-direction:column}
  #drawer.open{transform:none}
  #drawer header{padding:22px 22px 12px}
  #drawer h1{font-size:20px;font-weight:800;letter-spacing:.2px}
  #drawer header p{font-size:13px;color:var(--cream-dim);margin-top:2px}
  #list{overflow:auto;padding:4px 12px 20px;flex:1}
  #list h2{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(239,230,210,.48);margin:16px 10px 6px;font-weight:800}
  #list button{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:12px;text-align:left;font-weight:700;font-size:15px;color:var(--cream-dim)}
  #list button:hover{background:rgba(239,230,210,.07);color:var(--cream)}
  #list button.sel{background:rgba(239,230,210,.13);color:var(--cream)}
  #list button span.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
  #closeDrawer{position:absolute;right:12px;top:16px;width:34px;height:34px;border-radius:50%;font-size:20px;color:var(--cream-dim)}

  /* ---------- Thẻ thông tin ---------- */
  #card{position:fixed;left:clamp(14px,3vw,40px);bottom:clamp(76px,10vh,96px);max-width:min(420px,calc(100vw - 28px));padding:18px 20px;border-radius:18px;
    background:var(--panel);border:1px solid rgba(239,230,210,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:4;display:none}
  #card.show{display:block}
  #card .grp{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(239,230,210,.5);font-weight:800}
  #card h3{font-size:26px;font-weight:800;margin:2px 0 8px}
  #card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  #card .tags span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(239,230,210,.1);color:var(--cream)}
  #card p{font-size:14px;line-height:1.5;color:var(--cream-dim)}
  #faces{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  #faces button{font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid rgba(239,230,210,.2);color:var(--cream-dim)}
  #faces button.on{background:var(--cream);color:#1d3b39;border-color:var(--cream)}
  #hint{position:fixed;right:clamp(14px,3vw,40px);bottom:clamp(80px,10.5vh,100px);font-size:12px;color:rgba(239,230,210,.55);z-index:4;display:none}
  #hint.show{display:block}

  /* ---------- Phòng xem chi tiết ---------- */
  #studio{display:none}
  #studio.show{display:block}
  .st-head{position:fixed;left:clamp(16px,3vw,40px);top:clamp(14px,3vh,30px);z-index:4}
  .st-kicker{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(239,230,210,.5);font-weight:800}
  .st-head h2{font-size:clamp(24px,3vw,34px);font-weight:800;margin:2px 0 8px}
  .st-head .tags{display:flex;gap:6px;flex-wrap:wrap}
  .st-head .tags span{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(239,230,210,.1)}
  .st-pick{position:fixed;left:clamp(10px,2vw,30px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;z-index:4;
    padding:8px;border-radius:16px;background:rgba(14,40,39,.6);border:1px solid rgba(239,230,210,.1);max-height:62vh;overflow:auto}
  .st-pick button{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;font-weight:700;font-size:14px;color:var(--cream-dim);text-align:left;white-space:nowrap}
  .st-pick button:hover{background:rgba(239,230,210,.07);color:var(--cream)}
  .st-pick button.sel{background:rgba(239,230,210,.15);color:var(--cream)}
  .st-pick .dot{width:11px;height:11px;border-radius:50%;flex:none}
  .st-faces{position:fixed;right:clamp(14px,3vw,40px);top:clamp(16px,3vh,32px);display:flex;flex-direction:column;gap:6px;z-index:4;align-items:flex-end}
  .st-faces button{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid rgba(239,230,210,.22);color:var(--cream-dim);background:rgba(14,40,39,.5)}
  .st-faces button.on{background:var(--cream);color:#1d3b39;border-color:var(--cream)}
  .st-tools{position:fixed;left:50%;bottom:clamp(70px,9vh,86px);transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:999px;
    background:rgba(14,40,39,.72);border:1px solid rgba(239,230,210,.14);z-index:4;max-width:calc(100vw - 20px);overflow-x:auto}
  .st-tools button{padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--cream-dim);white-space:nowrap}
  .st-tools button.on{background:rgba(239,230,210,.14);color:var(--cream)}
  .st-tools .sep{width:1px;background:rgba(239,230,210,.16);margin:5px 2px}
  .st-hint{position:fixed;right:clamp(14px,3vw,40px);bottom:clamp(76px,9.5vh,92px);font-size:12px;color:rgba(239,230,210,.5);z-index:3}
  @media (max-width:900px){ .st-pick{top:auto;bottom:130px;transform:none;flex-direction:row;max-width:calc(100vw - 20px);overflow-x:auto} .st-hint{display:none} }

  @media (max-width:720px){
    #bar button{padding:7px 10px;font-size:12px}
    #card{bottom:74px;padding:14px 16px}
    #card h3{font-size:21px}
    .h-warn{display:none}
  }
</style>

    <svg viewBox="0 0 26 14"><use href="#fishIcon"/></svg>

<aside id="drawer" aria-label="Bộ sưu tập">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   Tiện ích
   ===================================================================== */
const TAU = Math.PI * 2;
let _seed = 1;
const seed = s => { _seed = (s * 2654435761) >>> 0 || 1; };
const rnd = () => { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; };
const R = (a, b) => a + (b - a) * rnd();
const pick = a => a[Math.floor(rnd() * a.length)];
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const ease = t => t * t * (3 - 2 * t);
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
const tmpC = new THREE.Color();
const vary = (hex, amt) => new THREE.Color(hex).multiplyScalar(1 + (rnd() - 0.5) * amt);

function keys(k, t) {
  if (t <= k[0][0]) return k[0].slice(1);
  for (let i = 0; i < k.length - 1; i++) {
    const a = k[i], b = k[i + 1];
    if (t <= b[0]) { const u = ease((t - a[0]) / (b[0] - a[0])); return a.slice(1).map((v, j) => lerp(v, b[j + 1], u)); }
  }
  return k[k.length - 1].slice(1);
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.autoClear = false;
const MAX_ANISO = Math.min(4, renderer.capabilities.getMaxAnisotropy());

function ctex(w, h, draw, repeat = false) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function rrect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
/* Hình học không chỉ mục, chỉ giữ position/normal/uv để gộp được */
function prep(g) {
  let n = g.index ? g.toNonIndexed() : g;
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', n.attributes.position);
  if (!n.attributes.normal) n.computeVertexNormals();
  out.setAttribute('normal', n.attributes.normal);
  out.setAttribute('uv', n.attributes.uv || new THREE.BufferAttribute(new Float32Array(n.attributes.position.count * 2), 2));
  return out;
}
function scaleUV(g, sx, sy) { const uv = g.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * sx, uv.getY(i) * sy); return g; }
/* Tô màu theo từng mặt tam giác (mặt phẳng lộ rõ khối) */
function paintFaces(geo, fn) {
  const p = geo.attributes.position, n = p.count, col = new Float32Array(n * 3);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3(), cen = new THREE.Vector3(), nor = new THREE.Vector3(), e1 = new THREE.Vector3(), e2 = new THREE.Vector3();
  for (let i = 0; i < n; i += 3) {
    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);
    cen.copy(a).add(b).add(c).multiplyScalar(1 / 3);
    nor.crossVectors(e1.subVectors(b, a), e2.subVectors(c, a)).normalize();
    const cc = fn(cen, nor, i / 3);
    for (let k = 0; k < 3; k++) { col[(i + k) * 3] = cc.r; col[(i + k) * 3 + 1] = cc.g; col[(i + k) * 3 + 2] = cc.b; }
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return geo;
}

/* =====================================================================
   Shader dùng chung: vệt sáng đáy (caustics), lay rong, uốn thân cá, viền
   ===================================================================== */
const U_TIME = { value: 0 };
const CAUSTIC_GLSL = `
float cLines(vec2 p, float t){
  vec2 w = p + 0.45*vec2(sin(p.y*1.25 + t*0.7), sin(p.x*1.45 - t*0.6));
  float a = abs(sin(w.x*1.9 + t*0.55) + sin(w.y*2.15 - t*0.5));
  float b = abs(sin((w.x + w.y)*1.4 - t*0.4) + sin((w.x - w.y)*1.6 + t*0.6));
  return (1.0 - smoothstep(0.0, 0.5, a))*0.55 + (1.0 - smoothstep(0.0, 0.5, b))*0.55;
}
float caustic(vec2 p, float t){
  float pool = 0.5 + 0.5*sin(p.x*0.21 + t*0.13)*sin(p.y*0.29 - t*0.11);
  return cLines(p, t) * (0.35 + 0.65*pool);
}`;

function patch(mat, f = {}) {
  const key = 'p' + (f.caustic ? 'c' : '') + (f.sway ? 's' : '') + (f.bend ? 'b' : '') + (f.outline ? 'o' : '');
  mat.customProgramCacheKey = () => key;
  mat.onBeforeCompile = sh => {
    sh.uniforms.uTime = U_TIME;
    let head = 'uniform float uTime;\n', body = '';
    if (f.bend) {
      sh.uniforms.uSwim = f.bend.swim; sh.uniforms.uSwim2 = f.bend.swim2;
      head += 'uniform vec4 uSwim; uniform vec4 uSwim2;\n';
      body += `{ float bw = 1.0 - smoothstep(uSwim2.y, uSwim2.x, position.x); bw *= bw;
                 transformed.z += sin(uSwim.x + position.x*uSwim.z)*uSwim.y*bw + uSwim2.z*bw; }\n`;
    }

  const floorTex = ctex(256, 256, (g, w, h) => { const r = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); r.addColorStop(0, 'rgba(120,190,180,0.28)'); r.addColorStop(.6, 'rgba(70,140,132,0.12)'); r.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = r; g.fillRect(0, 0, w, h); });
  const floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ map: floorTex, transparent: true, depthWrite: false }));

}
const studioShadow = new THREE.Mesh(SHADOW_GEO, MAT.shadow.clone()); studioShadow.position.y = .01; studioShadow.material.opacity = .45; studio.add(studioShadow);
const camStudio = new THREE.PerspectiveCamera(30, 16 / 9, .05, 200);
const ctlStudio = new OrbitControls(camStudio, canvas);
Object.assign(ctlStudio, { enabled: false, enableDamping: true, autoRotate: true, autoRotateSpeed: 1.4, minDistance: 1.8, maxDistance: 16, minPolarAngle: 0, maxPolarAngle: Math.PI });
const STUDIO_IDS = ['gold', 'neon', 'guppy', 'platy', 'angel', 'parrot', 'lahan', 'shrimp', 'turtle'];
const STUDIO_TARGET = new THREE.Vector3(0, 1.5, 0), studioCache = {};
let studioObj = null, studioId = null, studioSwim = true, viewGoal = null;
const sPick = $('sPick');
for (const id of STUDIO_IDS) {
  const it = ITEMS.find(i => i.id === id), b = document.createElement('button'); b.dataset.id = id;
  b.innerHTML = `<span class="dot" style="background:${it.dot}"></span>${it.name}`; b.onclick = () => studioShow(id); sPick.appendChild(b);
}
function studioShow(id) {
  if (studioObj) studio.remove(studioObj);
  const obj = studioCache[id] || (studioCache[id] = BUILD[id]());
  obj.position.set(0, 0, 0); obj.rotation.set(0, 0, 0); obj.scale.setScalar(1);
  const b = solidBox(obj), sz = b.getSize(new THREE.Vector3()), s = 3.2 / Math.max(sz.x, sz.y * 1.2, sz.z);
  obj.scale.setScalar(s);
  const c = solidBox(obj).getCenter(new THREE.Vector3()); obj.position.sub(c).add(STUDIO_TARGET);
  if (obj.userData.setOutline) obj.userData.setOutline(null);
  studio.add(obj); studioObj = obj; studioId = id;
  const sb = solidBox(obj), ss = sb.getSize(new THREE.Vector3());
  studioShadow.scale.set(ss.x * .8, 1, Math.max(.6, ss.z * 1.4)); studioShadow.position.set(sb.getCenter(new THREE.Vector3()).x, .01, 0);
  const it = ITEMS.find(i => i.id === id);

  [...sPick.children].forEach(x => x.classList.toggle('sel', x.dataset.id === id));

const VIEWS = { three: [.75, .32, 1], side: [0, .04, 1], top: [.001, 1, .06], front: [1, .12, .02], back: [-1, .12, .02], under: [.001, -1, .06] };
function studioView(v, instant = false) {
  const d = v === 'three' ? 9.5 : camStudio.position.distanceTo(ctlStudio.target) || 9.5;
  const goal = STUDIO_TARGET.clone().add(new THREE.Vector3(...VIEWS[v]).normalize().multiplyScalar(d));
  ctlStudio.target.copy(STUDIO_TARGET);
  if (instant || !camStudio.position.lengthSq()) { camStudio.position.copy(goal); ctlStudio.update(); viewGoal = null; } else viewGoal = goal;
  if (v !== 'three') { ctlStudio.autoRotate = false; $('sRotate').classList.remove('on'); }
}
$('sRotate').onclick = () => { ctlStudio.autoRotate = !ctlStudio.autoRotate; $('sRotate').classList.toggle('on', ctlStudio.autoRotate); };
$('sSwim').onclick = () => { studioSwim = !studioSwim; $('sSwim').classList.toggle('on', studioSwim); };
$('sReset').onclick = () => { ctlStudio.autoRotate = true; $('sRotate').classList.add('on'); studioView('three'); };
document.querySelectorAll('.st-tools [data-view]').forEach(b => b.onclick = () => studioView(b.dataset.view));
ctlStudio.addEventListener('start', () => { viewGoal = null; });
function updateStudio(dt) {
  if (studioObj && studioObj.userData.update) { if (studioObj.userData.kind === 'fish') studioObj.userData.update(dt, studioSwim ? .7 : 0, 0); else studioObj.userData.update(dt); }
  if (viewGoal) { camStudio.position.lerp(viewGoal, 1 - Math.exp(-dt * 6)); if (camStudio.position.distanceTo(viewGoal) < .01) viewGoal = null; }
  ctlStudio.update();
}
$('bStudio').onclick = () => select('studio');

canvas.addEventListener('dblclick', () => { if (mode === 'tank') { ctlTank.enabled = !ctlTank.enabled; if (!ctlTank.enabled) { camTank.position.copy(TANK_CAM.pos); ctlTank.target.copy(TANK_CAM.target); camTank.lookAt(TANK_CAM.target); } $('hint').classList.toggle('show', ctlTank.enabled); } });

/* =====================================================================
   Vòng lặp
   ===================================================================== */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  for (const c of [camTank, camItem, camStudio]) { c.aspect = w / h; c.updateProjectionMatrix(); }
  camStudio.fov = h > w ? 46 : 30; camStudio.updateProjectionMatrix();
  if (w > 900) camItem.setViewOffset(w, h, -w * .1, 0, w, h); else camItem.clearViewOffset(); // đẩy vật sang phải, chừa chỗ cho thẻ thông tin
  const portrait = h > w; camTank.fov = portrait ? 58 : 38; camTank.updateProjectionMatrix();
  overlayU.uRes.value.set(w, h);
}
window.addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
const camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3(), lookCur = TANK_CAM.target.clone();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  U_TIME.value += dt;
  if (mode === 'tank') {
    updateTank(dt);
    if (follow && !ctlTank.enabled) {
      const dir = new THREE.Vector3(Math.cos(hero.yaw), 0, -Math.sin(hero.yaw));
      lookGoal.copy(hero.pos).addScaledVector(dir, 1.3); lookGoal.y = .5;
      camGoal.copy(lookGoal).add(new THREE.Vector3(0, 7.2, 6.0));
      camTank.position.lerp(camGoal, 1 - Math.exp(-dt * 4)); lookCur.lerp(lookGoal, 1 - Math.exp(-dt * 4)); camTank.lookAt(lookCur);
    } else if (!ctlTank.enabled) {
      camTank.position.lerp(TANK_CAM.pos, 1 - Math.exp(-dt * 3)); lookCur.lerp(TANK_CAM.target, 1 - Math.exp(-dt * 3)); camTank.lookAt(lookCur);
    } else ctlTank.update();
  } else if (mode === 'studio') updateStudio(dt);
  else {
    if (shown && shown.userData.update) { if (shown.userData.kind === 'fish') shown.userData.update(dt, .35, 0); else shown.userData.update(dt); }
    ctlItem.update();
  }
  renderer.clear();
  if (mode === 'studio') renderer.render(studio, camStudio);
  else { renderer.render(scene, mode === 'tank' ? camTank : camItem); renderer.render(overlayScene, overlayCam); }
  requestAnimationFrame(frame);
}
{ // Mở thẳng một mục qua địa chỉ, ví dụ creatures.html#gold hoặc #angel/scared
  const [id, face, view] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (id === 'studio') { // creatures.html#studio/angel/narrow/top
    select('studio'); if (STUDIO_IDS.includes(face)) studioShow(face);
    if (view && studioObj.userData.setFace) { studioObj.userData.setFace(view); const lb = (FACE_LABELS.find(f => f[0] === view) || [])[1]; [...$('sFaces').children].forEach(b => b.classList.toggle('on', b.textContent === lb)); }
    const v = decodeURIComponent(location.hash.slice(1)).split('/')[3]; if (VIEWS[v]) studioView(v, true);
  } else
  select(ITEMS.some(i => i.id === id) ? id : 'tank');
  if (face && shown && shown.userData.setFace) shown.userData.setFace(face);
  if (view && mode === 'item') { // góc xem cố định để kiểm tra: top, front, back, side
    const d = camItem.position.distanceTo(ctlItem.target), t = ctlItem.target;
    const dir = { top: [0.001, 1, 0.12], front: [1, .15, .05], back: [-1, .15, .05], side: [0, .05, 1] }[view];
    if (dir) { ctlItem.autoRotate = false; camItem.position.copy(t).add(new THREE.Vector3(...dir).normalize().multiplyScalar(d)); camItem.clearViewOffset(); ctlItem.update(); }
  }
  if (/[?&]nohud/.test(location.search)) { hudOn = false; syncUI(); }
}
frame();
